---
name: Release - Build and Publish

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v1.0.0)"
        required: true
        type: string
      docker_tag_suffix:
        description: "Docker tag suffix (e.g., latest, test, dev)"
        required: false
        type: string
        default: "latest"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  # Pinned rather than the action's `latest` default, so a Helm release cannot silently change
  # how the chart is packaged. Tracks the Helm 4 line that ArgoCD bundles.
  HELM_VERSION: v4.2.4

jobs:
  # =============================================================================
  # Prepare Release Information
  # =============================================================================
  prepare:
    name: Prepare Release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      lowercase_image_name: ${{ steps.lowercase_repo.outputs.name }} # New output for lowercased repo name
      lowercase_owner: ${{ steps.lowercase_repo.outputs.owner }}
      docker_tag_suffix: ${{ steps.docker_suffix.outputs.suffix }}
      rust_channel: ${{ steps.pin.outputs.channel }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve Rust channel
        id: pin
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Get version information
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          VERSION="${TAG#v}"
          PRERELEASE="false"
          if [[ "$TAG" =~ (alpha|beta|rc) ]]; then
            PRERELEASE="true"
          fi

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout requested release tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Verify version matches Cargo.toml
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          # Only verify version for tags in vX.X.X or vX.X.X-suffix format
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            TAG_VERSION="${{ steps.version.outputs.version }}"
            CARGO_VERSION=$(grep "^version" Cargo.toml | head -1 | cut -d'"' -f2)

            echo "Git tag version: ${TAG_VERSION}"
            echo "Cargo.toml version: ${CARGO_VERSION}"

            if [ "${TAG_VERSION}" != "${CARGO_VERSION}" ]; then
              echo "::error::Version mismatch! Git tag is v${TAG_VERSION} but Cargo.toml has version ${CARGO_VERSION}"
              echo "Please ensure the Git tag matches the version in Cargo.toml"
              exit 1
            fi

            echo "✅ Version verification passed: ${TAG_VERSION}"
          else
            echo "Skipping version verification for tag: ${TAG} (not in vX.X.X format)"
          fi

      - name: Get repository and owner names in lowercase
        id: lowercase_repo # Step to convert repo name to lowercase
        run: |
          REPOSITORY_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          OWNER_NAME=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          {
            echo "name=${REPOSITORY_NAME}"
            echo "owner=${OWNER_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Get Docker tag suffix
        id: docker_suffix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.docker_tag_suffix }}" ]; then
            SUFFIX="${{ github.event.inputs.docker_tag_suffix }}"
          else
            SUFFIX="latest"
          fi
          echo "suffix=${SUFFIX}" >> "$GITHUB_OUTPUT"

  # =============================================================================
  # Build Linux Binaries
  # =============================================================================
  build-linux-x64-musl:
    needs: prepare
    uses: ./.github/workflows/build-binary.yml
    with:
      target_name: Linux x86_64 (musl)
      target_triple: x86_64-unknown-linux-musl
      runner_os: ubuntu-24.04
      git_ref: ${{ needs.prepare.outputs.tag }}
      rust_channel: ${{ needs.prepare.outputs.rust_channel }}
      version: ${{ needs.prepare.outputs.version }}

  build-linux-x64-gnu:
    needs: prepare
    uses: ./.github/workflows/build-binary.yml
    with:
      target_name: Linux x86_64 (GNU)
      target_triple: x86_64-unknown-linux-gnu
      runner_os: ubuntu-24.04
      git_ref: ${{ needs.prepare.outputs.tag }}
      rust_channel: ${{ needs.prepare.outputs.rust_channel }}
      version: ${{ needs.prepare.outputs.version }}

  build-linux-arm64-gnu:
    needs: prepare
    uses: ./.github/workflows/build-binary.yml
    with:
      target_name: Linux ARM64 (GNU)
      target_triple: aarch64-unknown-linux-gnu
      runner_os: ubuntu-24.04-arm
      git_ref: ${{ needs.prepare.outputs.tag }}
      rust_channel: ${{ needs.prepare.outputs.rust_channel }}
      version: ${{ needs.prepare.outputs.version }}

  build-linux-arm64-musl:
    needs: prepare
    uses: ./.github/workflows/build-binary.yml
    with:
      target_name: Linux ARM64 (musl)
      target_triple: aarch64-unknown-linux-musl
      runner_os: ubuntu-24.04-arm
      git_ref: ${{ needs.prepare.outputs.tag }}
      rust_channel: ${{ needs.prepare.outputs.rust_channel }}
      version: ${{ needs.prepare.outputs.version }}

  # =============================================================================
  # Build and Push Docker Images
  # =============================================================================
  build-docker:
    name: Build Docker ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: amd64
            arch: linux/amd64
            runner: ubuntu-24.04
          - name: arm64
            arch: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform.arch }}
          push: true
          pull: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.lowercase_image_name }}:${{ needs.prepare.outputs.version }}-${{ matrix.platform.name }}-temp
            sockudo/sockudo:${{ needs.prepare.outputs.version }}-${{ matrix.platform.name }}-temp

  # =============================================================================
  # Create Multi-Platform Manifests
  # =============================================================================
  docker-manifest:
    name: Create Multi-Platform Manifests
    runs-on: ubuntu-24.04
    needs: [prepare, build-docker]

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push GHCR manifest
        run: |
          # Create version manifest
          docker manifest create \
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.lowercase_image_name }}:${{ needs.prepare.outputs.version }} \
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.lowercase_image_name }}:${{ needs.prepare.outputs.version }}-amd64-temp \
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.lowercase_image_name }}:${{ needs.prepare.outputs.version }}-arm64-temp
          docker manifest push ${{ env.REGISTRY }}/${{ needs.prepare.outputs.lowercase_image_name }}:${{ needs.prepare.outputs.version }}

          # Create suffix manifest
          docker manifest create \
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.lowercase_image_name }}:${{ needs.prepare.outputs.docker_tag_suffix }} \
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.lowercase_image_name }}:${{ needs.prepare.outputs.version }}-amd64-temp \
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.lowercase_image_name }}:${{ needs.prepare.outputs.version }}-arm64-temp
          docker manifest push ${{ env.REGISTRY }}/${{ needs.prepare.outputs.lowercase_image_name }}:${{ needs.prepare.outputs.docker_tag_suffix }}

      - name: Create and push Docker Hub manifest
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Create version manifest
          docker manifest create \
            sockudo/sockudo:${{ needs.prepare.outputs.version }} \
            sockudo/sockudo:${{ needs.prepare.outputs.version }}-amd64-temp \
            sockudo/sockudo:${{ needs.prepare.outputs.version }}-arm64-temp
          docker manifest push sockudo/sockudo:${{ needs.prepare.outputs.version }}

          # Create suffix manifest
          docker manifest create \
            sockudo/sockudo:${{ needs.prepare.outputs.docker_tag_suffix }} \
            sockudo/sockudo:${{ needs.prepare.outputs.version }}-amd64-temp \
            sockudo/sockudo:${{ needs.prepare.outputs.version }}-arm64-temp
          docker manifest push sockudo/sockudo:${{ needs.prepare.outputs.docker_tag_suffix }}

          # Clean up temporary platform-specific tags
          echo "Cleaning up temporary tags..."
          TOKEN=$(
            jq -n \
              --arg username "$DOCKERHUB_USERNAME" \
              --arg password "$DOCKERHUB_TOKEN" \
              '{username: $username, password: $password}' \
              | curl -s -X POST \
                -H "Content-Type: application/json" \
                --data-binary @- \
                https://hub.docker.com/v2/users/login/ \
              | jq -r .token
          )

          if [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ]; then
            echo "Deleting temp tag: ${{ needs.prepare.outputs.version }}-amd64-temp"
            curl -s -o /dev/null -X DELETE \
              -H "Authorization: Bearer ${TOKEN}" \
              "https://hub.docker.com/v2/repositories/sockudo/sockudo/tags/${{ needs.prepare.outputs.version }}-amd64-temp/" || true

            echo "Deleting temp tag: ${{ needs.prepare.outputs.version }}-arm64-temp"
            curl -s -o /dev/null -X DELETE \
              -H "Authorization: Bearer ${TOKEN}" \
              "https://hub.docker.com/v2/repositories/sockudo/sockudo/tags/${{ needs.prepare.outputs.version }}-arm64-temp/" || true
          else
            echo "Failed to authenticate for cleanup, temp tags will remain"
          fi

  # =============================================================================
  # Publish Helm Chart
  # =============================================================================
  publish-chart:
    name: Publish Helm Chart
    runs-on: ubuntu-24.04
    needs: [prepare, docker-manifest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Package chart
        run: |
          helm package charts/sockudo \
            --version "${{ needs.prepare.outputs.version }}" \
            --app-version "${{ needs.prepare.outputs.version }}" \
            --destination dist

      - name: Push chart
        run: |
          helm push "dist/sockudo-${{ needs.prepare.outputs.version }}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ needs.prepare.outputs.lowercase_owner }}/charts"

      - name: Upload chart artifact
        uses: actions/upload-artifact@v7
        with:
          name: sockudo-chart
          path: dist/sockudo-${{ needs.prepare.outputs.version }}.tgz
          retention-days: 1

  # =============================================================================
  # Publish to Crates.io
  # =============================================================================
  publish-crates:
    name: Publish to Crates.io
    runs-on: ubuntu-24.04
    needs:
      [
        prepare,
        build-linux-x64-musl,
        build-linux-x64-gnu,
        build-linux-arm64-gnu,
        build-linux-arm64-musl,
      ]
    if: needs.prepare.outputs.prerelease != 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.prepare.outputs.rust_channel }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev libmariadb-dev cmake protobuf-compiler libprotobuf-dev

      - name: Publish workspace crates to crates.io
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        if: env.CRATES_IO_TOKEN != ''
        run: |
          # Publish crates in dependency order, skipping already-published ones.
          CRATES=(
            sockudo-protocol
            sockudo-filter
            sockudo-core
            sockudo-app
            sockudo-cache
            sockudo-queue
            sockudo-metrics
            sockudo-rate-limiter
            sockudo-webhook
            sockudo-delta
            sockudo-ai-transport
            sockudo-push
            sockudo-adapter
            sockudo-ably-compat
            sockudo-mcp
            sockudo
          )

          FAILED_CRATES=()

          for crate in "${CRATES[@]}"; do
            echo "::group::Publishing $crate"
            VERSION=$(cargo metadata --no-deps --format-version 1 \
              | jq -r ".packages[] | select(.name == \"$crate\") | .version")

            # Check if this version already exists on crates.io
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://crates.io/api/v1/crates/$crate/$VERSION")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "$crate@$VERSION already published, skipping."
            else
              echo "Publishing $crate@$VERSION..."
              cargo publish -p "$crate" --token "$CRATES_IO_TOKEN" || {
                echo "::warning::Failed to publish $crate@$VERSION (will retry)"
                FAILED_CRATES+=("$crate")
              }
              # Wait for crates.io index to propagate
              sleep 30
            fi
            echo "::endgroup::"
          done

          # Retry failed crates once (index may have propagated by now)
          if [ ${#FAILED_CRATES[@]} -gt 0 ]; then
            echo "Retrying ${#FAILED_CRATES[@]} failed crate(s) after index propagation delay..."
            sleep 30
            FINAL_FAILURES=()
            for crate in "${FAILED_CRATES[@]}"; do
              echo "::group::Retrying $crate"
              VERSION=$(cargo metadata --no-deps --format-version 1 \
                | jq -r ".packages[] | select(.name == \"$crate\") | .version")
              echo "Retrying $crate@$VERSION..."
              cargo publish -p "$crate" --token "$CRATES_IO_TOKEN" || {
                echo "::error::Failed to publish $crate@$VERSION after retry"
                FINAL_FAILURES+=("$crate")
              }
              sleep 30
              echo "::endgroup::"
            done

            if [ ${#FINAL_FAILURES[@]} -gt 0 ]; then
              echo "::error::Failed to publish after retry: ${FINAL_FAILURES[*]}"
              exit 1
            fi
          fi

  # =============================================================================
  # Create GitHub Release (Final Step)
  # =============================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs:
      [
        prepare,
        build-linux-x64-musl,
        build-linux-x64-gnu,
        build-linux-arm64-gnu,
        build-linux-arm64-musl,
        docker-manifest,
        publish-crates,
        publish-chart,
      ]
    if: |
      always() && !cancelled() &&
      needs.build-linux-x64-musl.result == 'success' &&
      needs.build-linux-x64-gnu.result == 'success' &&
      needs.build-linux-arm64-gnu.result == 'success' &&
      needs.build-linux-arm64-musl.result == 'success' &&
      needs.docker-manifest.result == 'success' &&
      (needs.publish-crates.result == 'success' || needs.publish-crates.result == 'skipped') &&
      needs.publish-chart.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./release-artifacts
          pattern: sockudo-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "Sockudo ${{ needs.prepare.outputs.tag }}"
          generate_release_notes: true
          body: |
            ## Installation

            ### Linux installer (Recommended)
            ```bash
            curl --proto '=https' --tlsv1.2 -sSfL \
              https://sockudo.io/install.sh \
              | sh -s -- --version ${{ needs.prepare.outputs.version }}
            ```

            ### Using cargo
            ```bash
            cargo install sockudo --version ${{ needs.prepare.outputs.version }}
            ```

            ### Using Docker
            ```bash
            docker pull ghcr.io/${{ needs.prepare.outputs.lowercase_image_name }}:${{ needs.prepare.outputs.version }}
            docker pull sockudo/sockudo:${{ needs.prepare.outputs.version }}
            ```

            ### Using Helm
            ```bash
            helm install sockudo \
              oci://ghcr.io/${{ needs.prepare.outputs.lowercase_owner }}/charts/sockudo \
              --version ${{ needs.prepare.outputs.version }}
            ```

            ### Direct Download
            Linux archives and their SHA-256 checksums are attached below.

            ## Platform Support
            - ✅ Linux x86_64 (GNU)
            - ✅ Linux x86_64 (musl)
            - ✅ Linux ARM64 (GNU)
            - ✅ Linux ARM64 (musl)
            - ✅ Docker linux/amd64
            - ✅ Docker linux/arm64
            - 🛠️ Other platforms via `cargo install sockudo`
          files: |
            ./release-artifacts/*
            ./install.sh
          draft: false
          prerelease: ${{ needs.prepare.outputs.prerelease }}
