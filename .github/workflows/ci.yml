name: CI - Lint and Test

on:
  workflow_dispatch: {}
  push:
    branches: [main, master, develop, beta]
  pull_request:
    branches: [main, master, develop, beta]

permissions:
  contents: read
  issues: write
  pull-requests: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Incremental artifacts bloat the shared cache and its restore time.
  CARGO_INCREMENTAL: 0
  # Debuginfo is ~75% of every compiled object in this workspace and nothing in
  # CI reads it. Dropping it shrinks the shared target/ cache roughly 4x, which
  # is the single largest per-job cost, and shortens every link step. Backtraces
  # keep symbol names; only file/line detail is lost.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # Only refs every PR can restore from may write the cache: the protected
  # branches seed it, and a manual dispatch is an explicit opt-in for seeding a
  # branch under test. PR runs are read-only so they cannot evict the entry.
  CARGO_CACHE_MODE: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/beta'))) && 'restore-and-save' || 'restore' }}
  # Live service endpoints, matching docker-compose.test.yml.
  DATABASE_REDIS_HOST: localhost
  DATABASE_REDIS_PORT: 16379
  REDIS_CLUSTER_NODES: localhost:7001,localhost:7002,localhost:7003
  NATS_SERVERS: nats://localhost:14222,nats://localhost:14223
  DATABASE_MYSQL_HOST: localhost
  DATABASE_MYSQL_PORT: 13306
  DATABASE_MYSQL_USERNAME: root
  DATABASE_MYSQL_PASSWORD: root123
  DATABASE_MYSQL_DATABASE: sockudo
  SCYLLADB_NODES: localhost:19042
  SCYLLADB_KEYSPACE: sockudo_test
  DATABASE_POSTGRES_HOST: localhost
  DATABASE_POSTGRES_PORT: 15432
  DATABASE_POSTGRES_USERNAME: postgres
  DATABASE_POSTGRES_PASSWORD: postgres123
  DATABASE_POSTGRES_DATABASE: sockudo_test
  DYNAMODB_ENDPOINT: http://localhost:18000
  DYNAMODB_REGION: us-east-1

concurrency:
  # Cancel superseded runs on the same PR/branch instead of stacking them;
  # pushes to protected branches are never cancelled mid-flight.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # =============================================================================
  # Prebuild: compile the dependency graph once per Cargo.lock so every job
  # restores a warm target/ instead of recompiling ~700 crates.
  # =============================================================================
  prebuild:
    name: Prebuild dependency cache
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust and restore shared cache
        id: setup
        uses: ./.github/actions/rust-setup
        with:
          cache: restore
          components: rustfmt, clippy
          apt-packages: libpq-dev libmariadb-dev

      # Compile everything CI jobs run later (tests, clippy, bench binaries) in
      # one shared pass. Fingerprints land in target/ and are reused by every
      # downstream job with the same toolchain and lockfile. `--all-targets`
      # covers the benches that the benchmark guards and the push job build.
      - name: Prebuild workspace test and clippy artifacts
        run: |
          cargo test --workspace --all-features --all-targets --no-run
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Save shared build cache
        # Only on a miss: a hit means this exact key is already stored and the
        # incremental rebuild lives in the PR's own ephemeral target/.
        if: env.CARGO_CACHE_MODE == 'restore-and-save' && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.setup.outputs.cache-key }}

  # =============================================================================
  # Lint and Format Check
  # =============================================================================
  lint:
    name: Lint and Format
    runs-on: ubuntu-24.04
    needs: [prebuild]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust and restore shared cache
        uses: ./.github/actions/rust-setup
        with:
          cache: restore
          components: rustfmt, clippy
          apt-packages: shellcheck

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check published metrics build without Tokio unstable APIs
        run: cargo check -p sockudo-metrics --config 'build.rustflags=[]'

      - name: Check Linux installer
        run: |
          sh -n install.sh
          shellcheck install.sh

      - name: Run clippy
        # Fingerprints prebuilt by the prebuild job; clippy only re-lints crates
        # whose sources changed in this PR.
        run: cargo clippy --all-targets --all-features -- -D warnings

  # =============================================================================
  # Test Suite
  #
  # Sharded by crate group so the wall clock is bounded by the slowest shard
  # instead of the sum of every integration suite. Every shard runs the same
  # `--all-features` graph and the same live backends as the single job it
  # replaces; the union of the shards is the full workspace.
  # =============================================================================
  test:
    name: Test Suite (${{ matrix.name }})
    runs-on: ubuntu-24.04
    needs: [prebuild]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Partition of the 18 workspace members, balanced by test count
        # (605 / 543 / 484 / 485 as of this change).
        include:
          - name: transport
            packages: -p sockudo-adapter
          - name: core
            packages: -p sockudo-core -p sockudo-protocol
          - name: storage
            packages: >-
              -p sockudo-push -p sockudo-ai-transport -p sockudo-ai-benches
              -p sockudo-app -p sockudo-queue -p sockudo-cache -p sockudo-delta
              -p sockudo-rate-limiter -p sockudo-metrics -p sockudo-filter
              -p sockudo-webhook
          - name: server
            packages: >-
              -p sockudo -p sockudo-ably-compat -p sockudo-mcp
              -p sockudo-simulator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Ensure runner disk headroom
        # The cached target/ is ~4x smaller since debuginfo is disabled; only
        # reclaim the preinstalled toolchains when the runner is actually tight.
        run: |
          df -h /
          avail_gib=$(df -Pk / | awk 'NR==2 { print int($4 / 1048576) }')
          echo "free_gib=$avail_gib"
          if [ "$avail_gib" -lt 20 ]; then
            sudo rm -rf \
              /usr/local/lib/android \
              /usr/share/dotnet \
              /opt/ghc \
              /opt/hostedtoolcache/CodeQL \
              /opt/hostedtoolcache/go \
              /opt/hostedtoolcache/Python
          fi
          docker system prune -af || true
          df -h /

      - name: Set up Rust and restore shared cache
        uses: ./.github/actions/rust-setup
        with:
          cache: restore
          apt-packages: libpq-dev libmariadb-dev mysql-client postgresql-client

      - name: Start test services
        run: bash scripts/ci/wait-for-test-services.sh

      - name: Run tests
        run: cargo test --all-features ${{ matrix.packages }}

      - name: Cleanup test services
        if: always()
        run: |
          echo "Stopping test services..."
          docker compose -f docker-compose.test.yml down -v || true
          docker system prune -f || true

  # =============================================================================
  # Push Feature Matrix
  #
  # `cargo test --all-features` proves the union compiles; this proves each push
  # provider and storage backend also compiles on its own.
  # =============================================================================
  push-feature-matrix:
    name: Push Feature Matrix
    runs-on: ubuntu-24.04
    needs: [prebuild]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust and restore shared cache
        uses: ./.github/actions/rust-setup
        with:
          cache: restore
          components: clippy
          apt-packages: libpq-dev libmariadb-dev

      - name: Check push feature matrix
        run: |
          cargo check -p sockudo-push --all-features
          cargo check -p sockudo-push --features push-fcm,push-apns,push-webpush,push-hms,push-wns
          cargo check -p sockudo-push --features dynamodb,surrealdb,scylladb,postgres,mysql
          cargo clippy -p sockudo-push --all-targets --features push-fcm,push-apns,push-webpush,push-hms,push-wns,dynamodb,surrealdb,scylladb,postgres,mysql -- -D warnings

  # =============================================================================
  # Security Audit
  # =============================================================================
  security:
    name: Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install cargo-audit and cargo-deny
        # Prebuilt release binaries instead of compiling both crates from
        # source (~4.5 min on every run).
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Cache advisory database
        # cargo-audit reads only Cargo.lock and its advisory DB; a rolling
        # DB cache avoids downloading the full git history on cold runs.
        uses: actions/cache@v6
        with:
          path: ~/.cargo/advisory-db
          key: advisory-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            advisory-db-${{ runner.os }}-

      - name: Security audit
        # Ignored advisories are configured in .cargo/audit.toml.
        run: cargo audit

      - name: Dependency policy
        run: cargo deny check

  # =============================================================================
  # AI Transport Release Feature Matrix
  # =============================================================================
  ai-release-feature-matrix:
    name: AI Transport Release Feature Matrix (${{ matrix.name }})
    runs-on: ubuntu-24.04
    needs: [prebuild]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default-no-ai
            args: ""
            check_default_no_ai: true
          - name: ai-transport-alone
            args: "--no-default-features --features ai-transport"
            check_default_no_ai: false
          - name: ai-transport-redis
            args: "--no-default-features --features v2,ai-transport,redis"
            check_default_no_ai: false
          - name: ai-transport-redis-cluster
            args: "--no-default-features --features v2,ai-transport,redis-cluster"
            check_default_no_ai: false
          - name: ai-transport-nats
            args: "--no-default-features --features v2,ai-transport,nats"
            check_default_no_ai: false
          - name: full
            args: "--no-default-features --features full"
            check_default_no_ai: false
          - name: no-default-pusher
            args: "--no-default-features"
            check_default_no_ai: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust and restore shared cache
        uses: ./.github/actions/rust-setup
        with:
          cache: restore
          components: clippy
          apt-packages: libpq-dev libmariadb-dev

      # `cargo test --no-run` is the codegen proof for this feature graph and
      # clippy the lint proof; a separate `cargo check` would only repeat the
      # metadata pass. Formatting is checked once, in the lint job.
      - name: Build tests for feature graph
        run: cargo test -p sockudo --all-targets --no-run ${{ matrix.args }}

      - name: Clippy feature graph
        run: cargo clippy -p sockudo --all-targets ${{ matrix.args }} -- -D warnings

      - name: Assert default graph excludes AI Transport
        if: matrix.check_default_no_ai
        run: |
          if cargo tree -p sockudo -e features | grep -q 'ai-transport'; then
            echo "default feature graph contains ai-transport"
            exit 1
          fi

  # =============================================================================
  # AI Transport GA Evidence
  # =============================================================================
  ai-ga-evidence:
    name: AI Transport GA Evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check deterministic GA evidence
        run: scripts/ai-transport-ga-gate.sh ci-evidence

  # =============================================================================
  # AI Transport Docker Feature Builds
  # =============================================================================
  ai-docker-feature-builds:
    name: AI Transport Docker Feature Builds (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: without-ai
            features: "v2,redis,postgres"
          - name: with-ai
            features: "v2,ai-transport,redis,postgres"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR for the layer cache
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Layer cache lives in the registry, not in the Actions cache: `mode=max`
      # image layers are multi-GB and were evicting the shared cargo cache.
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: false
          tags: sockudo/ai-transport-ci:${{ matrix.name }}
          cache-from: type=registry,ref=ghcr.io/sockudo/sockudo:buildcache-ci-${{ matrix.name }}
          cache-to: type=registry,ref=ghcr.io/sockudo/sockudo:buildcache-ci-${{ matrix.name }},mode=max,ignore-error=true
          build-args: |
            SOCKUDO_FEATURES=${{ matrix.features }}
            CARGO_BUILD_JOBS=4

  # =============================================================================
  # AI Transport Benchmark Regression Guard
  #
  # The two benchmark guards are the longest jobs in the pipeline, so they are
  # deliberately not gated on prebuild: they restore the same shared cache and
  # start at t=0 instead of paying the prebuild serialization on top of their
  # own base/head measurements.
  # =============================================================================
  ai-benchmark-regression:
    name: AI Transport Benchmark Regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust and restore shared cache
        uses: ./.github/actions/rust-setup
        with:
          cache: restore

      - name: Run AI Transport benchmark guard
        run: scripts/ai-transport-bench-guard.sh

  # =============================================================================
  # Ably Compatibility Benchmark Regression Guard
  # =============================================================================
  ably-compat-benchmark-regression:
    name: Ably Compatibility Benchmark Regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust and restore shared cache
        uses: ./.github/actions/rust-setup
        with:
          cache: restore

      - name: Resolve benchmark revisions
        id: benchmark-revisions
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CHECKED_OUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base_sha="$PUSH_BEFORE_SHA"
            head_sha="$CHECKED_OUT_SHA"
          else
            base_sha="$(git rev-parse "${CHECKED_OUT_SHA}^")"
            head_sha="$CHECKED_OUT_SHA"
          fi
          git cat-file -e "${base_sha}^{commit}"
          git cat-file -e "${head_sha}^{commit}"
          echo "base-sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head-sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Benchmark base revision
        env:
          BASE_SHA: ${{ steps.benchmark-revisions.outputs.base-sha }}
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          rm -rf target/criterion
          cargo bench -p sockudo-ably-compat --features bench --bench compatibility_hot_paths -- --noplot --save-baseline pr-base

      - name: Benchmark head revision against base
        env:
          HEAD_SHA: ${{ steps.benchmark-revisions.outputs.head-sha }}
        run: |
          set -euo pipefail
          git checkout --detach "$HEAD_SHA"
          cargo bench -p sockudo-ably-compat --features bench --bench compatibility_hot_paths -- --noplot --baseline pr-base

      - name: Evaluate compatibility regression budgets
        id: initial-compatibility-budget
        continue-on-error: true
        run: >-
          python3 scripts/ably-compat-release-guard.py
          --budgets tests/load/ably-compat/budgets.json
          --criterion-root target/criterion
          --require-criterion-comparison

      - name: Confirm reported compatibility regressions
        if: steps.initial-compatibility-budget.outcome == 'failure'
        env:
          BASE_SHA: ${{ steps.benchmark-revisions.outputs.base-sha }}
          HEAD_SHA: ${{ steps.benchmark-revisions.outputs.head-sha }}
        run: |
          set -euo pipefail
          cp -R target/criterion target/criterion-initial
          # Re-measure both revisions so runner load or CPU frequency drift
          # cannot make a repeated head-only sample look reproducible.
          git checkout --detach "$BASE_SHA"
          rm -rf target/criterion
          cargo bench -p sockudo-ably-compat --features bench --bench compatibility_hot_paths -- --noplot --save-baseline confirmation-base
          git checkout --detach "$HEAD_SHA"
          cargo bench -p sockudo-ably-compat --features bench --bench compatibility_hot_paths -- --noplot --baseline confirmation-base

      - name: Enforce compatibility regression budgets
        if: steps.initial-compatibility-budget.outcome == 'success'
        run: >-
          python3 scripts/ably-compat-release-guard.py
          --budgets tests/load/ably-compat/budgets.json
          --criterion-root target/criterion
          --require-criterion-comparison

      - name: Enforce reproduced compatibility regressions
        if: steps.initial-compatibility-budget.outcome == 'failure'
        run: >-
          python3 scripts/ably-compat-release-guard.py
          --budgets tests/load/ably-compat/budgets.json
          --criterion-root target/criterion-initial
          --confirmation-criterion-root target/criterion
          --require-criterion-comparison

      - name: Store machine-readable benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ably-compat-criterion-${{ github.run_id }}
          path: |
            target/criterion/ably_compat_*
            target/criterion-initial/ably_compat_*
          if-no-files-found: error

  # =============================================================================
  # AI Transport Protocol Conformance
  #
  # The Rust AIT-S suites (ait_s_conformance, ait_s_coverage) are integration
  # tests of sockudo-ai-transport, so the Test Suite shards already run them.
  # Only the Node golden transcripts need a separate job.
  # =============================================================================
  ai-conformance:
    name: AI Transport Conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate Node golden transcripts and forward-compat fixtures
        run: AIT_CONFORMANCE_OFFLINE=1 scripts/ai-conformance-node.sh

  # =============================================================================
  # Manual Build Instructions (PR only)
  # =============================================================================
  manual-build-info:
    name: 🔨 Manual Build Instructions
    runs-on: ubuntu-24.04
    needs: [prebuild, lint, test, push-feature-matrix, security, ai-release-feature-matrix, ai-ga-evidence, ai-docker-feature-builds, ai-benchmark-regression, ably-compat-benchmark-regression, ai-conformance]
    steps:
      - name: Post build instructions
        uses: actions/github-script@v9
        with:
          script: |
            console.log('Starting manual build info job...');
            console.log('Event name:', context.eventName);

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/manual-build.yml`;
            let prNumber, branchName;

            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
              branchName = context.payload.pull_request.head.ref;
            } else if (context.eventName === 'push') {
              // For push events, try to find the associated PR
              branchName = context.ref.replace('refs/heads/', '');
              const prs = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branchName}`,
                state: 'open'
              });
              if (prs.data.length > 0) {
                prNumber = prs.data[0].number;
              }
            }

            if (!prNumber) {
              console.log('No PR found for this push, skipping');
              return;
            }

            console.log('PR number:', prNumber);
            console.log('Branch name:', branchName);
            console.log('Run URL:', runUrl);

            // Check if we've already posted instructions
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            console.log(`Found ${comments.data.length} existing comments`);

            const existingComment = comments.data.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('Manual Build Available')
            );

            console.log('Existing comment found:', !!existingComment);

            if (!existingComment) {
              const body = [
                '## 🔨 Manual Build Available',
                '',
                '**To build artifacts for this PR:**',
                '',
                `1. **Click here:** [🚀 Trigger Manual Build](${runUrl})`,
                '2. Click **"Run workflow"** (green button)',
                `3. Select branch: \`${branchName}\``,
                '4. Choose artifacts to build:',
                '   - ☑️ Linux x64 (GNU + musl)',
                '   - ☑️ Linux ARM64 (GNU + musl)',
                '   - ☑️ Docker image',
                '5. Click **"Run workflow"**',
                '',
                '**Artifacts will be posted here when build completes** ⬇️',
                '',
                '---',
                '*This comment will be updated with download links once builds are triggered*'
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });

              console.log('Posted manual build instructions to PR');
            } else {
              console.log('Manual build instructions already posted, skipping');
            }
