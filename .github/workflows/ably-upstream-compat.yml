name: Ably upstream compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ably-upstream-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Must match ci.yml so this workflow reuses the same shared target/ cache.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  build-sockudo:
    name: Build Sockudo compatibility binary
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust and restore shared cache
        uses: ./.github/actions/rust-setup
        with:
          cache: restore
          apt-packages: libpq-dev

      - name: Build compatibility server
        run: >-
          cargo build --locked -p sockudo
          --features v2,ai-transport,ably-compat,redis,postgres,push,monolith

      - name: Package server binary
        run: |
          ldd target/debug/sockudo
          tar -czf sockudo-ably-compat.tar.gz target/debug/sockudo

      - name: Upload server binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sockudo-ably-compat-${{ github.run_id }}
          path: sockudo-ably-compat.tar.gz
          compression-level: 0
          retention-days: 1

  ably-js:
    name: ably-js main (WebSocket)
    needs: build-sockudo
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout latest ably-js main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ably/ably-js
          ref: main
          path: .upstream/ably-js
          submodules: recursive
          persist-credentials: false

      - name: Use Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .upstream/ably-js/package-lock.json

      - name: Download server binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sockudo-ably-compat-${{ github.run_id }}
          path: .artifacts

      - name: Test local compatibility provisioner
        run: node --test tests/ably-compat/upstream-sandbox.test.mjs

      - name: Prepare server and SDK
        shell: bash
        run: |
          tar -xzf "${GITHUB_WORKSPACE}/.artifacts/sockudo-ably-compat.tar.gz" -C "${GITHUB_WORKSPACE}"
          npm ci --ignore-scripts
          npm run build:node
          npm run build:push
          npm run build:packages
        working-directory: .upstream/ably-js

      - name: Record source revisions
        run: |
          {
            echo "# Ably upstream compatibility"
            echo
            echo "| Source | Revision |"
            echo "| --- | --- |"
            echo "| sockudo PR merge | \`${GITHUB_SHA}\` |"
            echo "| ably/ably-js main | \`$(git -C .upstream/ably-js rev-parse HEAD)\` |"
          } >> "${GITHUB_STEP_SUMMARY}"
          {
            echo "sockudo ${GITHUB_SHA}"
            echo "ably-js $(git -C .upstream/ably-js rev-parse HEAD)"
          } > "${RUNNER_TEMP}/ably-js-revisions.txt"

      - name: Run latest WebSocket compatibility suite
        shell: bash
        run: |
          set -euo pipefail

          sandbox_log="${RUNNER_TEMP}/ably-js-sandbox.log"
          server_log_dir="${RUNNER_TEMP}/ably-js-servers"
          mkdir -p "${server_log_dir}"

          node tests/ably-compat/upstream-sandbox.mjs \
            --sockudo-bin "${GITHUB_WORKSPACE}/target/debug/sockudo" \
            --config "${GITHUB_WORKSPACE}/config/config.toml" \
            --listen 127.0.0.1:9080 \
            --ws-package-root "${GITHUB_WORKSPACE}/.upstream/ably-js" \
            --log-dir "${server_log_dir}" >"${sandbox_log}" 2>&1 &
          sandbox_pid=$!
          cleanup() {
            kill "${sandbox_pid}" 2>/dev/null || true
            wait "${sandbox_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:9080/; then
              break
            fi
            if ! kill -0 "${sandbox_pid}" 2>/dev/null; then
              tail -n 100 "${sandbox_log}"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:9080/ || {
            tail -n 100 "${sandbox_log}"
            exit 1
          }

          cd .upstream/ably-js
          mapfile -d '' test_files < <(
            find packages/core-impl/test/unit packages/core-impl/test/rest packages/core-impl/test/realtime \
              -type f -name '*.test.js' \
              ! -name 'liveobjects.test.js' \
              ! -name 'transports.test.js' \
              -print0 | sort -z
          )
          printf 'Selected %s ably-js files from main\n' "${#test_files[@]}"
          printf '%s\n' "${test_files[@]}"
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "::error::no ably-js tests matched; upstream layout changed again"
            exit 1
          fi

          # Anchored on the test title alone: upstream renames describe groups.
          harness_only_excludes=' node_transports$| Should use the primary domain as the first attempted for every connection attempt$| Init without any tls key should enable tls$'
          CI=true \
          ABLY_LOCAL_SANDBOX_URL=http://127.0.0.1:9080 \
          ABLY_TEST_TRANSPORTS=web_socket \
          ./node_modules/.bin/mocha \
            --exit \
            --grep "${harness_only_excludes}" \
            --invert \
            "${test_files[@]}" 2>&1 | tee "${RUNNER_TEMP}/ably-js.log"

      - name: Upload compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ably-js-main-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ably-js.log
            ${{ runner.temp }}/ably-js-revisions.txt
            ${{ runner.temp }}/ably-js-sandbox.log
            ${{ runner.temp }}/ably-js-servers
          if-no-files-found: warn
          retention-days: 7

  ably-go:
    name: ably-go main (${{ matrix.lane }})
    needs: build-sockudo
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    strategy:
      fail-fast: false
      matrix:
        lane: [unit, json, msgpack]

    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout latest ably-go main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ably/ably-go
          ref: main
          path: .upstream/ably-go
          submodules: recursive
          persist-credentials: false

      - name: Use Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache-dependency-path: .upstream/ably-go/go.sum

      - name: Use Node.js 24 for the local sandbox
        if: matrix.lane != 'unit'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download server binary
        if: matrix.lane != 'unit'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sockudo-ably-compat-${{ github.run_id }}
          path: .artifacts

      - name: Prepare SDK and local transport adapter
        shell: bash
        run: |
          set -euo pipefail
          git -C .upstream/ably-go apply --check "${GITHUB_WORKSPACE}/tests/ably-compat/ably-go-local-tls.patch"
          git -C .upstream/ably-go apply "${GITHUB_WORKSPACE}/tests/ably-compat/ably-go-local-tls.patch"
          git -C .upstream/ably-go apply --check "${GITHUB_WORKSPACE}/tests/ably-compat/ably-go-local-fallback.patch"
          git -C .upstream/ably-go apply "${GITHUB_WORKSPACE}/tests/ably-compat/ably-go-local-fallback.patch"
          git -C .upstream/ably-go apply --check "${GITHUB_WORKSPACE}/tests/ably-compat/ably-go-local-internet-probe.patch"
          git -C .upstream/ably-go apply "${GITHUB_WORKSPACE}/tests/ably-compat/ably-go-local-internet-probe.patch"
          git -C .upstream/ably-go apply --check "${GITHUB_WORKSPACE}/tests/ably-compat/ably-go-local-harness-v2.patch"
          git -C .upstream/ably-go apply "${GITHUB_WORKSPACE}/tests/ably-compat/ably-go-local-harness-v2.patch"
          if [ "${{ matrix.lane }}" != unit ]; then
            tar -xzf .artifacts/sockudo-ably-compat.tar.gz
          fi

      - name: Record source revisions
        run: |
          {
            echo "# Ably Go upstream compatibility (${{ matrix.lane }})"
            echo
            echo "| Source | Revision |"
            echo "| --- | --- |"
            echo "| sockudo PR merge | \`${GITHUB_SHA}\` |"
            echo "| ably/ably-go main | \`$(git -C .upstream/ably-go rev-parse HEAD)\` |"
          } >> "${GITHUB_STEP_SUMMARY}"
          {
            echo "sockudo ${GITHUB_SHA}"
            echo "ably-go $(git -C .upstream/ably-go rev-parse HEAD)"
          } > "${RUNNER_TEMP}/ably-go-${{ matrix.lane }}-revisions.txt"

      - name: Run official unit suite
        if: matrix.lane == 'unit'
        shell: bash
        working-directory: .upstream/ably-go
        run: |
          set -o pipefail
          go test -tags=unit -count=1 ./... 2>&1 | tee "${RUNNER_TEMP}/ably-go-unit.log"

      - name: Run official integration suite
        if: matrix.lane != 'unit'
        shell: bash
        run: |
          set -euo pipefail

          sandbox_log="${RUNNER_TEMP}/ably-go-${{ matrix.lane }}-sandbox.log"
          server_log_dir="${RUNNER_TEMP}/ably-go-${{ matrix.lane }}-servers"
          mkdir -p "${server_log_dir}"

          node tests/ably-compat/upstream-sandbox.mjs \
            --sockudo-bin "${GITHUB_WORKSPACE}/target/debug/sockudo" \
            --config "${GITHUB_WORKSPACE}/config/config.toml" \
            --listen 127.0.0.1:9080 \
            --log-dir "${server_log_dir}" >"${sandbox_log}" 2>&1 &
          sandbox_pid=$!
          cleanup() {
            kill "${sandbox_pid}" 2>/dev/null || true
            wait "${sandbox_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:9080/; then
              break
            fi
            if ! kill -0 "${sandbox_pid}" 2>/dev/null; then
              tail -n 100 "${sandbox_log}"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:9080/

          if [ "${{ matrix.lane }}" = json ]; then
            protocol=application/json
          else
            protocol=application/x-msgpack
          fi
          cd .upstream/ably-go
          ABLY_LOCAL_SANDBOX_URL=http://127.0.0.1:9080 \
          ABLY_LOCAL_PLAINTEXT_REALTIME=1 \
          ABLY_LOCAL_FALLBACK_HOSTS=sandbox.realtime.ably-nonprod.net,sandbox-a-fallback.ably-realtime.com,sandbox.a.fallback.ably-realtime-nonprod.com,sandbox.b.fallback.ably-realtime-nonprod.com,sandbox.c.fallback.ably-realtime-nonprod.com,sandbox.d.fallback.ably-realtime-nonprod.com,sandbox.e.fallback.ably-realtime-nonprod.com \
          ABLY_LOCAL_REST_HOSTS=sandbox.realtime.ably-nonprod.net,rest.ably.io,internet-up.ably-realtime.com,sandbox-a-fallback.ably-realtime.com,main.a.fallback.ably-realtime.com,main.b.fallback.ably-realtime.com,main.c.fallback.ably-realtime.com,main.d.fallback.ably-realtime.com,main.e.fallback.ably-realtime.com,sandbox.a.fallback.ably-realtime-nonprod.com,sandbox.b.fallback.ably-realtime-nonprod.com,sandbox.c.fallback.ably-realtime-nonprod.com,sandbox.d.fallback.ably-realtime-nonprod.com,sandbox.e.fallback.ably-realtime-nonprod.com \
          ABLY_LOCAL_INTERNET_ENDPOINT=127.0.0.1:9080 \
          ABLY_LOCAL_REALTIME_ENDPOINT=127.0.0.1:7100 \
          ABLY_CREATE_JWT_URL=https://127.0.0.1:9080/createJWT \
          ABLY_STATS_FIXTURE_URL=http://127.0.0.1:9080/stats \
          ABLY_PROTOCOL="${protocol}" \
          go test -tags=integration -p 1 -race -count=1 -timeout 120m ./... \
            2>&1 | tee "${RUNNER_TEMP}/ably-go-${{ matrix.lane }}.log"

      - name: Upload compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ably-go-main-${{ matrix.lane }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ably-go-${{ matrix.lane }}.log
            ${{ runner.temp }}/ably-go-${{ matrix.lane }}-revisions.txt
            ${{ runner.temp }}/ably-go-${{ matrix.lane }}-sandbox.log
            ${{ runner.temp }}/ably-go-${{ matrix.lane }}-servers
          if-no-files-found: warn
          retention-days: 7

  ably-ai-transport-js:
    name: ably-ai-transport-js main
    needs: build-sockudo
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout latest ably-ai-transport-js main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ably/ably-ai-transport-js
          ref: main
          path: .upstream/ably-ai-transport-js
          submodules: recursive
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          package_json_file: .upstream/ably-ai-transport-js/package.json

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: .upstream/ably-ai-transport-js/pnpm-lock.yaml

      - name: Download server binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sockudo-ably-compat-${{ github.run_id }}
          path: .artifacts

      - name: Prepare server and SDK
        shell: bash
        run: |
          tar -xzf "${GITHUB_WORKSPACE}/.artifacts/sockudo-ably-compat.tar.gz" -C "${GITHUB_WORKSPACE}"
          pnpm install --frozen-lockfile
        working-directory: .upstream/ably-ai-transport-js

      - name: Record source revisions
        run: |
          {
            echo "# Ably AI Transport upstream compatibility"
            echo
            echo "| Source | Revision |"
            echo "| --- | --- |"
            echo "| sockudo PR merge | \`${GITHUB_SHA}\` |"
            echo "| ably/ably-ai-transport-js main | \`$(git -C .upstream/ably-ai-transport-js rev-parse HEAD)\` |"
          } >> "${GITHUB_STEP_SUMMARY}"
          {
            echo "sockudo ${GITHUB_SHA}"
            echo "ably-ai-transport-js $(git -C .upstream/ably-ai-transport-js rev-parse HEAD)"
          } > "${RUNNER_TEMP}/ably-ai-transport-js-revisions.txt"

      - name: Run complete upstream unit suite
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee "${RUNNER_TEMP}/ably-ai-transport-js-unit.log"
        working-directory: .upstream/ably-ai-transport-js

      - name: Run complete upstream integration suite
        shell: bash
        run: |
          set -euo pipefail

          sandbox_log="${RUNNER_TEMP}/ably-ai-transport-js-sandbox.log"
          server_log_dir="${RUNNER_TEMP}/ably-ai-transport-js-servers"
          mkdir -p "${server_log_dir}"

          node tests/ably-compat/upstream-sandbox.mjs \
            --sockudo-bin "${GITHUB_WORKSPACE}/target/debug/sockudo" \
            --config "${GITHUB_WORKSPACE}/config/config.toml" \
            --listen 127.0.0.1:9080 \
            --log-dir "${server_log_dir}" >"${sandbox_log}" 2>&1 &
          sandbox_pid=$!
          cleanup() {
            kill "${sandbox_pid}" 2>/dev/null || true
            wait "${sandbox_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:9080/; then
              break
            fi
            if ! kill -0 "${sandbox_pid}" 2>/dev/null; then
              tail -n 100 "${sandbox_log}"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:9080/ || {
            tail -n 100 "${sandbox_log}"
            exit 1
          }

          cd .upstream/ably-ai-transport-js
          CI=true \
          ABLY_LOCAL_SANDBOX_URL=http://127.0.0.1:9080 \
          ABLY_TEST_TRANSPORTS=web_socket \
          pnpm run test:integration 2>&1 | tee "${RUNNER_TEMP}/ably-ai-transport-js-integration.log"

      - name: Upload compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ably-ai-transport-js-main-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ably-ai-transport-js-integration.log
            ${{ runner.temp }}/ably-ai-transport-js-revisions.txt
            ${{ runner.temp }}/ably-ai-transport-js-sandbox.log
            ${{ runner.temp }}/ably-ai-transport-js-servers
            ${{ runner.temp }}/ably-ai-transport-js-unit.log
          if-no-files-found: warn
          retention-days: 7

  ably-published-sdks:
    name: Ably published SDKs (latest)
    needs: build-sockudo
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download server binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sockudo-ably-compat-${{ github.run_id }}
          path: .artifacts

      - name: Install newest published SDKs
        shell: bash
        run: |
          tar -xzf "${GITHUB_WORKSPACE}/.artifacts/sockudo-ably-compat.tar.gz" -C "${GITHUB_WORKSPACE}"
          cd tests/ably-compat
          npm ci --ignore-scripts
          npm install --no-save --ignore-scripts \
            ably@latest @ably/ai-transport@latest @ably/pubsub-device@latest @ably/pubsub-server@latest
          npm ls --depth=0 ably @ably/ai-transport @ably/pubsub-device @ably/pubsub-server \
            | tee "${RUNNER_TEMP}/ably-published-sdks-versions.txt"
          {
            echo "# Ably published SDKs"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/ably-published-sdks-versions.txt"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Run smoke harness
        shell: bash
        run: |
          set -euo pipefail

          server_log="${RUNNER_TEMP}/ably-published-sdks-server.log"
          PUSH_STORAGE_DRIVER=memory \
          PUSH_QUEUE_DRIVER=memory \
          PUSH_ALLOW_MEMORY_DRIVERS=true \
          "${GITHUB_WORKSPACE}/target/debug/sockudo" --config config/config.toml >"${server_log}" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "${server_pid}" 2>/dev/null || true
            wait "${server_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:6001/time; then
              break
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              tail -n 100 "${server_log}"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:6001/time || {
            tail -n 100 "${server_log}"
            exit 1
          }

          cd tests/ably-compat
          {
            npm test
            npm run pubsub:chat
            npm run ait:chat
          } 2>&1 | tee "${RUNNER_TEMP}/ably-published-sdks.log"

      - name: Upload compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ably-published-sdks-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ably-published-sdks.log
            ${{ runner.temp }}/ably-published-sdks-server.log
            ${{ runner.temp }}/ably-published-sdks-versions.txt
          if-no-files-found: warn
          retention-days: 7
