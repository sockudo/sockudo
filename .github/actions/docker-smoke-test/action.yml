name: Docker smoke test
description: >-
  Start a built image and assert that the health and metrics endpoints answer.

inputs:
  image:
    description: "Local image tag to run."
    required: true

runs:
  using: composite
  steps:
    - name: Test basic functionality
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        echo "Testing Docker image functionality..."

        docker run -d --name sockudo-test \
          --network host \
          -e RUST_LOG=info \
          -e DATABASE_REDIS_HOST=localhost \
          -e DATABASE_REDIS_PORT=6379 \
          -e SOCKUDO_DEFAULT_APP_ENABLED=true \
          "$IMAGE"

        # Wait for startup
        sleep 15

        # Test health endpoint
        if curl -f http://localhost:6001/up/app-id; then
          echo "✅ Health check passed"
        else
          echo "❌ Health check failed"
          docker logs sockudo-test
          exit 1
        fi

        # Test metrics endpoint
        if curl -f http://localhost:9601/metrics > /dev/null; then
          echo "✅ Metrics endpoint accessible"
        else
          echo "❌ Metrics endpoint failed"
          docker logs sockudo-test
          exit 1
        fi

        echo "✅ All tests passed!"

    - name: Cleanup
      if: always()
      shell: bash
      run: |
        docker stop sockudo-test || true
        docker rm sockudo-test || true
