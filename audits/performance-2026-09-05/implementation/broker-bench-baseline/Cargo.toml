[package]
name="services-brokers"
version="0.0.0"
edition="2024"
[workspace]
[[bin]]
name="services-brokers"
path="../services-bench/src/brokers.rs"
[dependencies]
sockudo-core={path="../baseline/crates/sockudo-core"}
sockudo-queue={path="../baseline/crates/sockudo-queue",features=["kafka","rabbitmq"]}
sonic-rs="0.5"
async-trait="0.1"
tokio={version="1",features=["full"]}
rdkafka={version="0.39",features=["cmake-build"]}
[profile.release]
lto=true
codegen-units=1
