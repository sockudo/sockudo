[package]
name = "services-perf"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false
[workspace]
[[bin]]
name="services-extra"
path="../services-bench/src/main.rs"
[dependencies]
sockudo-core = { path = "../../../../crates/sockudo-core" }
sockudo-app = { path = "../../../../crates/sockudo-app" }
sockudo-cache = { path = "../../../../crates/sockudo-cache", features = ["redis"] }
sockudo-queue = { path = "../../../../crates/sockudo-queue", features = ["redis"] }
sockudo-rate-limiter = { path = "../../../../crates/sockudo-rate-limiter", features = ["redis"] }
sockudo-metrics = { path = "../../../../crates/sockudo-metrics" }
sockudo-webhook = { path = "../../../../crates/sockudo-webhook", features = ["lambda"] }
sockudo-push = { path = "../../../../crates/sockudo-push" }
tokio = { version = "1", features = ["full"] }
sonic-rs = "0.5"
async-trait = "0.1"
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
[profile.release]
lto = true
codegen-units = 1
