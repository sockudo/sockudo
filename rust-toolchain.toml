# Rust version used for local development and CI. This file is the only place the
# version is declared; .github/actions/rust-toolchain and build-binary.yml read it.
#
# 1.100.0 reads registry.global-min-publish-age from .cargo/config.toml.
# Older versions ignore that setting and warn on every cargo command.
#
# fuzz/ uses nightly instead, because cargo-fuzz needs it.
[toolchain]
channel = "1.100.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
