[graph]
all-features = false
features = [
    "sockudo/ai-transport",
    "sockudo/push",
    "sockudo/push-fcm",
    "sockudo/push-apns",
    "sockudo/push-webpush",
    "sockudo/mysql",
    "sockudo/postgres",
]

[advisories]
# opentelemetry-otlp 0.32.0 pins zstd 0.13, so the OTLP HTTP exporter links
# zstd 0.13.3 / zstd-safe 7.3.0. Every 0.13.x release carries the advisories
# below; the fix is zstd 0.14.3 / zstd-safe 8.2.0. Upstream applied it
# (opentelemetry-rust PR #3819) but has not released a crate with it yet, so no
# registry-only resolution exists.
#
# Exposure: the exporter only calls `zstd::bulk::{compress, decompress}`. The
# affected APIs are the streaming encoder/decoder, `Seekable`, `InBuffer` and
# `OutBuffer`, none of which the exporter reaches. The gRPC path is already on
# the fixed line: tonic 0.14.8 links zstd 0.14.3.
#
# Only the vulnerability-severity advisories are listed here; cargo-deny does
# not gate the remaining zstd-safe "unsound" advisories, and listing them would
# report them as not encountered. `.cargo/audit.toml` carries the full set.
#
# Remove these once a release with the bump ships.
ignore = [
    "RUSTSEC-2026-0391", # zstd 0.13.3, stream reuse leaks data
    "RUSTSEC-2026-0398", # zstd-safe 7.3.0, Seekable Vec length
    "RUSTSEC-2026-0403", # zstd-safe 7.3.0, legacy frame uninitialized memory
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
    { crate = "rsa", reason = "RUSTSEC-2023-0071: RSA timing side-channel risk; JWT signing must use the AWS-LC backend instead" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
