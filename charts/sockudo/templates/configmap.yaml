{{- if and .Values.config.existingSecret .Values.configJson }}
{{- fail "config.existingSecret and configJson are mutually exclusive: the config file is supplied by the Secret, so remove configJson" -}}
{{- end }}
{{- if not .Values.config.existingSecret -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sockudo.configMapName" . }}
  labels:
    {{- include "sockudo.labels" . | nindent 4 }}
data:
  {{- if .Values.configJson }}
  config.json: |
    {{- .Values.configJson | nindent 4 }}
  {{- else }}
  config.json: |
    {
      "debug": {{ .Values.config.debug }},
      "host": "0.0.0.0",
      "port": 6001,
      "mode": {{ .Values.config.mode | quote }},
      "shutdown_grace_period": {{ .Values.config.shutdownGracePeriod | int64 }},
      "adapter": {
        "driver": {{ .Values.config.adapterDriver | quote }}
      },
      "app_manager": {
        "driver": {{ .Values.config.appManagerDriver | quote }}
      },
      "cache": {
        "driver": {{ .Values.config.cacheDriver | quote }}
      },
      "queue": {
        "driver": {{ .Values.config.queueDriver | quote }}
      },
      "http_api": {
        "usage_enabled": {{ .Values.config.httpApi.usageEnabled }},
        "accept_traffic": {
          "enabled": {{ .Values.config.httpApi.acceptTraffic.enabled }},
          "memory_threshold": {{ .Values.config.httpApi.acceptTraffic.memoryThreshold }},
          "memory_limit_bytes": {{ .Values.config.httpApi.acceptTraffic.memoryLimitBytes | default "null" }},
          "sample_interval_ms": {{ .Values.config.httpApi.acceptTraffic.sampleIntervalMs | int64 }}
        }
      },
      "rate_limiter": {
        "enabled": {{ .Values.config.rateLimiter.enabled }},
        "driver": {{ .Values.config.rateLimiterDriver | quote }}
      },
      "metrics": {
        "enabled": {{ .Values.config.metrics.enabled }},
        "driver": {{ .Values.config.metrics.driver | quote }},
        "host": "0.0.0.0",
        "port": 9601,
        "prometheus": {
          "prefix": {{ .Values.config.metrics.prefix | quote }}
        }
      },
      "opentelemetry": {
        "enabled": {{ .Values.config.openTelemetry.enabled }},
        "traces_enabled": {{ .Values.config.openTelemetry.tracesEnabled }},
        "metrics_enabled": {{ .Values.config.openTelemetry.metricsEnabled }},
        "logs_enabled": {{ .Values.config.openTelemetry.logsEnabled }},
        "service_name": {{ .Values.config.openTelemetry.serviceName | quote }},
        "service_namespace": {{ if .Values.config.openTelemetry.serviceNamespace }}{{ .Values.config.openTelemetry.serviceNamespace | quote }}{{ else }}null{{ end }},
        "deployment_environment": {{ if .Values.config.openTelemetry.deploymentEnvironment }}{{ .Values.config.openTelemetry.deploymentEnvironment | quote }}{{ else }}null{{ end }},
        "resource_attributes": {{ .Values.config.openTelemetry.resourceAttributes | toJson }},
        "endpoint": {{ if .Values.config.openTelemetry.endpoint }}{{ .Values.config.openTelemetry.endpoint | quote }}{{ else }}null{{ end }},
        "export_timeout_ms": {{ .Values.config.openTelemetry.exportTimeoutMs | int64 }},
        "batch_scheduled_delay_ms": {{ .Values.config.openTelemetry.batchScheduledDelayMs | int64 }},
        "batch_max_queue_size": {{ .Values.config.openTelemetry.batchMaxQueueSize | int64 }},
        "batch_max_export_batch_size": {{ .Values.config.openTelemetry.batchMaxExportBatchSize | int64 }},
        "metric_export_interval_ms": {{ .Values.config.openTelemetry.metricExportIntervalMs | int64 }},
        "propagation_trace_context": {{ .Values.config.openTelemetry.propagationTraceContext }},
        "propagation_baggage": {{ .Values.config.openTelemetry.propagationBaggage }}
      },
      "websocket": {
        "max_payload_kb": {{ .Values.config.websocket.maxPayloadKb | int64 }},
        "max_messages": {{ .Values.config.websocket.maxMessages | int64 }},
        "max_bytes": {{ .Values.config.websocket.maxBytes | int64 }},
        "ping_interval": {{ .Values.config.websocket.pingInterval | int64 }},
        "idle_timeout": {{ .Values.config.websocket.idleTimeout | int64 }},
        "compression": {{ .Values.config.websocket.compression | quote }}
      },
      "delta_compression": {
        "enabled": {{ .Values.config.deltaCompression.enabled }},
        "algorithm": {{ .Values.config.deltaCompression.algorithm | quote }},
        "full_message_interval": {{ .Values.config.deltaCompression.fullMessageInterval | int64 }},
        "min_message_size": {{ .Values.config.deltaCompression.minMessageSize | int64 }},
        "max_state_age_secs": {{ .Values.config.deltaCompression.maxStateAgeSecs | int64 }}
      },
      "ssl": {
        "enabled": {{ .Values.config.ssl.enabled }}
      },
      "cors": {
        "credentials": {{ .Values.config.cors.credentials }},
        "origin": {{ .Values.config.cors.origin | toJson }},
        "methods": {{ .Values.config.cors.methods | toJson }},
        "allowed_headers": {{ .Values.config.cors.allowedHeaders | toJson }}
      }
    }
  {{- end }}
{{- end }}
